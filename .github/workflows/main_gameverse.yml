# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - gameverse

on:
  push:
    branches:
      - main
  # Testy (Jest i Playwright) uruchamiają się też na pull requestach do main - deploy tylko po pushu/ręcznie.
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      # Jest: testy jednostkowe i integracyjne (tests/unit, tests/integration) - izolowana baza, bez sieci i kluczy API.
      - name: npm install, build, and test
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      - name: Upload artifact for deployment job
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  # Playwright: prawdziwa przeglądarka (Chromium). Sprawdza responsywność stron na 6 szerokościach ekranu
  # oraz czat na żywo (dwie osoby w osobnych przeglądarkach). Serwer testowy startuje sam, z izolowaną bazą
  # i katalogiem plików (tests/responsive/seed-and-start.js) - bez kluczy API i sekretów.
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'
          cache: npm

      - name: npm ci
        run: npm ci

      # Przeglądarka waży ok. 150 MB - trzymamy ją w cache, klucz zależy od wersji Playwrighta z package-lock.json.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser and system dependencies
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Responsive and live chat tests (Playwright)
        run: npm run test:responsive

      - name: Upload Playwright traces and screenshots (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: [build, responsive]
    # Wdrażamy tylko po pushu na main (albo ręcznym uruchomieniu) - nie z pull requestów.
    if: github.event_name != 'pull_request'

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'gameverse'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_DA832D6143404BE28B999167AC1AEEE0 }}
